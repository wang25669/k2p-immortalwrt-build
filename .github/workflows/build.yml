name: Build K2P Slim ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Build ImmortalWrt K2P ultra slim keep fullcone
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget qemu-utils

          git clone --depth 1 --branch openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          cd immortalwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cat > .config << 'EOCONFIG'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_ip6tables-mod-nat=y
          CONFIG_PACKAGE_kmod-ipt-nat6=y
          CONFIG_PACKAGE_kmod-nft-fullcone=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y
          CONFIG_PACKAGE_kmod-pppox=y
          CONFIG_PACKAGE_kmod-ppp=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_kmod-ipv6=y
          CONFIG_PACKAGE_miniupnpd=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_chinadns-ng=y
          CONFIG_PACKAGE_tcping=y
          EOCONFIG

          make defconfig
          # 强制关掉defconfig偷加的全家桶，但保留fullcone/nat
          ./scripts/config --disable CONFIG_PACKAGE_luci-app-opkg
          ./scripts/config --disable CONFIG_PACKAGE_luci-app-attendedsysupgrade
          ./scripts/config --disable CONFIG_PACKAGE_attendedsysupgrade-common
          ./scripts/config --disable CONFIG_PACKAGE_luci-i18n-opkg-zh-cn
          ./scripts/config --disable CONFIG_PACKAGE_luci-i18n-firewall-zh-cn
          ./scripts/config --disable CONFIG_PACKAGE_geoview
          ./scripts/config --disable CONFIG_PACKAGE_v2ray-geoip
          ./scripts/config --disable CONFIG_PACKAGE_v2ray-geosite
          ./scripts/config --disable CONFIG_PACKAGE_luci-theme-argon
          ./scripts/config --disable CONFIG_PACKAGE_dnsmasq-full
          ./scripts/config --disable CONFIG_PACKAGE_wpad-openssl
          make defconfig
          echo "=== defconfig ==="
          grep -E "phicomm_k2p|sing-box|homeproxy|ppp|ipv6|upnp|wpad|dnsmasq|fullcone" .config | head -40
          make -j$(nproc) || make -j1 V=s

      - name: Collect artifact
        if: always()
        run: |
          cd immortalwrt
          mkdir -p /tmp/firmware
          ls -lh bin/targets/ramips/mt7621/ 2>&1 | head -40
          cp -f bin/targets/ramips/mt7621/*squashfs-sysupgrade.bin /tmp/firmware/ 2>/dev/null || echo "NO SYSUPGRADE - TOO BIG"
          cp -f bin/targets/ramips/mt7621/*.manifest /tmp/firmware/ 2>/dev/null || true
          ls -lh /tmp/firmware/ 2>&1 | head -20
          ls -lh bin/targets/ramips/mt7621/*.bin 2>&1 | head -20

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-k2p-sysupgrade
          path: /tmp/firmware/*
          retention-days: 7

