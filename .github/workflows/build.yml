name: Build K2P Slim ImmortalWrt

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 --branch openwrt-23.05 https://github.com/immortalwrt/immortalwrt.git immortalwrt

      - name: Cache dl and ccache
        uses: actions/cache@v4
        with:
          path: |
            immortalwrt/dl
            ~/.ccache
          key: k2p-23.05-dl-ccache-${{ hashFiles('immortalwrt/feeds.conf.default') }}
          restore-keys: |
            k2p-23.05-dl-ccache-
            k2p-23.05-

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget qemu-utils ccache
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config << 'EOCONFIG'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_phicomm_k2p=y
          CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=1024
          CONFIG_PACKAGE_dnsmasq=y
          CONFIG_PACKAGE_ip6tables=y
          CONFIG_PACKAGE_ip6tables-mod-nat=y
          CONFIG_PACKAGE_kmod-ipt-nat6=y
          CONFIG_PACKAGE_kmod-nft-fullcone=y
          CONFIG_PACKAGE_luci-light=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_ppp=y
          CONFIG_PACKAGE_ppp-mod-pppoe=y
          CONFIG_PACKAGE_kmod-pppoe=y
          CONFIG_PACKAGE_kmod-pppox=y
          CONFIG_PACKAGE_kmod-ppp=y
          CONFIG_PACKAGE_odhcp6c=y
          CONFIG_PACKAGE_odhcpd-ipv6only=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_ipv6helper=y
          CONFIG_PACKAGE_kmod-ipv6=y
          CONFIG_PACKAGE_miniupnpd=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_wpad-mini=y
          EOCONFIG
          make defconfig
          off() { sed -i "/^CONFIG_$1=/d;/^# CONFIG_$1 is not set/d" .config; echo "# CONFIG_$1 is not set" >> .config; }
          off PACKAGE_luci
          off PACKAGE_luci-app-opkg
          off PACKAGE_luci-i18n-opkg-zh-cn
          off PACKAGE_luci-app-attendedsysupgrade
          off PACKAGE_attendedsysupgrade-common
          off PACKAGE_luci-theme-argon
          off PACKAGE_dnsmasq-full
          off PACKAGE_geoview
          off PACKAGE_v2ray-geoip
          off PACKAGE_v2ray-geosite
          off PACKAGE_chinadns-ng
          off PACKAGE_tcping
          off PACKAGE_wpad-openssl
          off PACKAGE_wpad-basic-wolfssl
          off PACKAGE_libopenssl3
          off PACKAGE_libopenssl-conf
          off PACKAGE_libnettle8
          off PACKAGE_libgmp10
          off PACKAGE_block-mount
          off SING_BOX_BUILD_ACME
          off SING_BOX_BUILD_CLASH_API
          off SING_BOX_BUILD_DHCP
          off SING_BOX_BUILD_ECH
          off SING_BOX_BUILD_EMBEDDED_TOR
          off SING_BOX_BUILD_GRPC
          off SING_BOX_BUILD_GVISOR
          off SING_BOX_BUILD_QUIC
          off SING_BOX_BUILD_REALITY_SERVER
          off SING_BOX_BUILD_V2RAY_API
          off SING_BOX_BUILD_WIREGUARD
          make defconfig
          echo "===== VERIFY CONFIG ====="
          grep -E "^CONFIG_SING_BOX|SING_BOX.*not set" .config
          grep -E "phicomm_k2p=|SQUASHFS_BLOCK|luci-light|luci-app-opkg|libopenssl3|libnettle8|fullcone|wpad-mini|dnsmasq=" .config
          echo "========================="
          make -j$(nproc) || make -j1 V=s

      - name: Size report
        if: always()
        run: |
          cd immortalwrt
          echo "===== bin/targets ====="
          ls -l bin/targets/ramips/mt7621/ || true
          echo "===== tmp images (real sizes) ====="
          ls -l build_dir/target-mipsel_24kc_musl/linux-ramips_mt7621/tmp/*.bin || true
          R=build_dir/target-mipsel_24kc_musl/linux-ramips_mt7621/root-ramips
          echo "===== rootfs total ====="
          du -sh $R || true
          echo "===== top 30 biggest files in rootfs ====="
          find $R -type f -printf '%10s %p\n' 2>/dev/null | sort -rn | head -30 || true

      - name: Collect artifact
        if: always()
        run: |
          cd immortalwrt
          mkdir -p /tmp/firmware
          cp -f bin/targets/ramips/mt7621/*squashfs-sysupgrade.bin /tmp/firmware/ 2>/dev/null || echo "NO SYSUPGRADE - STILL TOO BIG"
          cp -f bin/targets/ramips/mt7621/*.manifest /tmp/firmware/ 2>/dev/null || true
          ls -lh /tmp/firmware/

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-k2p-sysupgrade
          path: /tmp/firmware/*
          retention-days: 7

